name: Deploy

# CD (cách B): CI xanh trên main → build image trên GitHub → đẩy lên GHCR → SSH vào máy chủ kéo image mới + chạy lại (deploy/deploy-remote.sh:
# sao lưu DB → migrate → chờ API khoẻ → lỗi thì quay về image cũ). Cài đặt một lần + cách lùi: docs/09_CD.md.
#
# Thiết lập ở GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   DEPLOY_HOST (IP/tên miền máy chủ) · DEPLOY_USER (vd root) · DEPLOY_SSH_KEY (khoá RIÊNG dành cho CD) · DEPLOY_KNOWN_HOSTS (dòng known_hosts của máy chủ)
#   Variables: API_PUBLIC_URL (tuỳ chọn, vd https://api.example.com — để kiểm sức khoẻ công khai sau deploy)
# Muốn BẤM DUYỆT trước khi lên production: Settings → Environments → production → Required reviewers.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit hoặc nhánh muốn deploy
        required: false
        default: main

# Một lượt deploy tại một thời điểm; lượt sau chờ lượt trước xong (KHÔNG huỷ giữa chừng — đang migrate mà huỷ là nguy hiểm).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/fitly/eco_backend

jobs:
  build:
    name: build image · đẩy GHCR
    # Chỉ deploy khi CI của commit đó XANH (hoặc khi bấm chạy tay).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - name: Tên image
        id: meta
        run: |
          sha=$(git rev-parse HEAD)
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "sha=${sha}"
            echo "image=ghcr.io/${repo}:sha-${sha:0:12}"
            echo "latest=ghcr.io/${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          # `source` gắn package GHCR với repo này ⇒ GITHUB_TOKEN của repo đọc/ghi được package.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy lên máy chủ
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Chuẩn bị SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Compose/Caddyfile/script đổi cùng commit thì lên cùng lúc. KHÔNG đụng .env.production (nằm riêng trên máy chủ).
      - name: Đồng bộ file triển khai
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy-remote.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/"

      # Token job chỉ sống trong lượt chạy này; đăng xuất ngay sau khi kéo xong.
      - name: Đăng nhập GHCR trên máy chủ
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy (sao lưu → kéo image → migrate → chờ khoẻ)
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/deploy' && chmod +x deploy-remote.sh && IMAGE='$IMAGE' ./deploy-remote.sh"

      - name: Đăng xuất GHCR trên máy chủ
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker logout ghcr.io" || true

      - name: Kiểm sức khoẻ công khai
        if: vars.API_PUBLIC_URL != ''
        env:
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 "$API_PUBLIC_URL/api/v1/health"
